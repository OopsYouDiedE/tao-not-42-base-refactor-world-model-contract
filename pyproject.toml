[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tao-not-42"
version = "0.1.0"
description = "标准输入动作协议驱动的环境交互、数据、审核与训练系统"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.25,<2",
    "httpx>=0.28,<1",
    "numpy>=2.2,<3",
    "pillow>=11,<12",
    "pyarrow>=23,<24",
    "tenacity>=9.1,<10",
]

[project.optional-dependencies]
cpu = []
cuda = [
    "accelerate>=1.14,<2",
    "peft>=0.20,<1",
    "tensorboard>=2.20,<3",
    "torch>=2.11,<2.12",
    "transformers>=5.5,<5.6",
    "trl>=0.24,<0.25",
    "unsloth>=2026.8,<2027",
]
dev = [
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.11,<1",
]
craftground = [
    "craftground>=2.7.4,<2.8",
    "craftground-runtime-mc121>=0.1.0,<0.2",
]

[tool.setuptools.packages.find]
include = [
    "behavior_cloning_dataset_converters*",
    "behavior_cloning_training*",
    "environment_validation_tools*",
    "external_dataset_loaders_and_protocol_adapters*",
    "interaction_trajectory_review_agents*",
    "model_judgment_review_agents*",
    "online_environment_interaction_agents*",
    "online_interactive_environments*",
    "relative_advantage_comparison_training*",
    "shared_tools*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runs", "online_interactive_environments/godot/engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM105",
    "SIM115",
    "UP017",
    "UP038",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
exclude = ["runs", "online_interactive_environments/godot/engine"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
