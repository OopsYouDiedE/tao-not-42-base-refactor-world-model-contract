[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumine-craft"
version = "0.5.0"
description = "MineStudio 数据、Lumine 视觉动作训练与 CraftGround 闭环评估"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av>=12",
    "h5py>=3.10",
    "huggingface-hub>=0.34",
    "lmdb>=1.4",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10",
]

[project.optional-dependencies]
review = ["gradio>=4.44"]
train = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "peft>=0.13",
    "torch",
    "transformers>=5.5",
    "trl>=0.24",
    "unsloth",
    "unsloth-zoo",
]
craftground = ["craftground>=2.7.4"]
dev = ["pytest>=7", "ruff>=0.12"]

[project.scripts]
minestudio-download = "dataset.minestudio.download:main"
lumine-build-pretrain = "dataset.pretraining:main"
lumine-generate-questions = "dataset.trajectory.generate_questions:main"
lumine-review-questions = "dataset.trajectory.review_questions:main"
lumine-review-actions = "dataset.trajectory.review_actions:main"
lumine-pack-hdf5 = "dataset.trajectory.pack_hdf5:main"
lumine-inspect = "tools.action_inspector:main"
train-gemma-vision-sft = "train.gemma_vision_sft:main"
train-qwen-vision-sft = "train.qwen_vision_sft:main"
craftground-closed-loop = "game_environment.closed_loop_server:main"
craftground-verify-memory = "game_environment.verify_memory_snapshot:main"

[tool.setuptools.packages.find]
include = ["dataset*", "game_environment*", "lumine*", "tools*", "train*"]

[tool.pytest.ini_options]
cache_dir = "runs/cache/pytest"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"train/unsloth_vision_sft.py" = ["E402"]
