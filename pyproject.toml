[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tao-not-42"
version = "0.3.0"
description = "MineStudio → Lumine 预训练数据管线与 Unsloth Gemma4 / Qwen3.6 训练入口"
readme = "readme.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "huggingface-hub>=0.34",
    "lmdb>=1.4",
    "numpy",
    "opencv-python-headless",
    "av>=12",
    "pillow",
]

[project.optional-dependencies]
# 训练侧依赖单独一组：数据管线机器不必装 CUDA 栈。
train = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "peft>=0.13",
    "torch",
    "transformers>=5.5",
    "trl>=0.24",
    "unsloth",
    "unsloth-zoo",
]
# 开发期查看工具：只有 tools/action_inspector 用，生产路径不需要。
tools = ["gradio>=4.44"]
dev = ["pytest>=7.0"]

[project.scripts]
machine-environment = "machine_environment.hardware_report:main"
minestudio-download = "bc_datasets.minestudio.huggingface_download:main"
minestudio-split = "bc_datasets.minestudio.episode_split:main"
lumine-build-pretrain = "bc_datasets.minestudio.lumine_pretrain_builder:main"
train-gemma-vision-sft = "train.gemma_vision_sft:main"
train-qwen-vision-sft = "train.qwen_vision_sft:main"

[tool.setuptools.packages.find]
include = ["bc_datasets*", "machine_environment*", "tools*", "train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --tb=short"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["bc_datasets", "machine_environment", "tools", "train"]
