[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tao-not-42"
version = "0.1.0"
description = "标准输入动作协议驱动的环境交互、数据、审核与训练系统"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub",
    "httpx",
    "numpy",
    "pillow",
    "pyarrow",
    "tenacity",
]

[project.optional-dependencies]
cpu = [
    "torch",
    "torchaudio",
    "torchvision",
]
cuda = [
    "accelerate",
    "peft",
    "tensorboard",
    "torch",
    "torchaudio",
    "torchvision",
    "transformers",
    "trl",
    "unsloth",
]
dev = [
    "pyright",
    "pytest",
    "ruff",
]
godot = [
    "gymnasium",
    "stable-baselines3",
]
visualization = [
    "fastapi",
    "plotly",
    "uvicorn",
]
# CraftGround 是唯一锁定版本的依赖。核心包与 mc121 runtime 必须使用
# OopsYouDiedE/CraftGround tao-maintained 分支的同一精确提交，不得改为 PyPI
# 范围依赖或只锁分支名。安装时使用 --no-deps，再单独安装以下运行依赖：
# gymnasium protobuf psutil typing_extensions torch
craftground = [
    "craftground @ git+https://github.com/OopsYouDiedE/CraftGround.git@ac71d4ef6fb12b994d35b36f8eec518aa3a307e7",
    "craftground-runtime-mc121 @ git+https://github.com/OopsYouDiedE/CraftGround.git@ac71d4ef6fb12b994d35b36f8eec518aa3a307e7#subdirectory=minecraft/mc121",
]

[tool.setuptools.packages.find]
include = [
    "interaction_trajectory_review_agents*",
    "model_judgment_review_agents*",
    "online_environment_interaction_agents*",
    "online_interactive_environments*",
    "relative_advantage_comparison_training*",
    "shared_tools*",
    "trajectory_visualization*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runs", "online_interactive_environments/godot/engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM105",
    "SIM115",
    "UP017",
    "UP038",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
exclude = ["runs", "online_interactive_environments/godot/engine"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
